<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ХРАНИЛИЩЕ</title>
<style>
:root{--bg1:#0b0913;--bg2:#050507;--card:#10101a;--card2:#121019;--line:#262233;--txt:#e8eaf1;--dim:#8a8fa0;--acc:#8b5cf6;--acc2:#6d5cff;--red:#c8465a;--green:#7fe0a0;--blue:#aebfff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--txt);font-family:Roboto,Arial,sans-serif;min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding:20px 14px 40px}
header{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;text-align:center;margin-bottom:16px}
h1{font-size:24px;letter-spacing:.18em;font-weight:700}
header p{color:var(--dim);font-size:12px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
h2{font-size:14px;letter-spacing:.1em;margin-bottom:4px}
h2 .n{color:var(--dim);font-weight:400}
.sub{color:var(--dim);font-size:11px}
.btn{display:inline-block;border:0;border-radius:25px;padding:10px 22px;font-size:14px;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.btn.red{background:linear-gradient(90deg,#c8465a,#a83246)}
.btn.sm{padding:6px 14px;font-size:12px;border-radius:18px}
input,textarea,select{width:100%;background:#16141f;border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:10px 12px;font-size:14px;margin:6px 0;outline:none}
input:focus,textarea:focus{border-color:var(--acc)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--dim);font-size:11px}
#statusbar{text-align:center;font-size:12px;color:var(--dim);padding:6px;min-height:24px}
.item{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;display:flex;gap:12px}
.item img.thumb{width:92px;height:92px;object-fit:cover;border-radius:12px;background:#000;cursor:pointer;flex-shrink:0}
.item .info{flex:1;min-width:0}
.item .t{font-size:15px;font-weight:700;word-break:break-word}
.item .d{color:var(--dim);font-size:11px;margin-top:2px;white-space:pre-wrap}
.item .meta{color:var(--dim);font-size:11px;margin-top:4px}
.item .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.item .like{background:#16141f;border:1px solid var(--line);color:#fff;border-radius:16px;padding:6px 12px;font-size:12px;cursor:pointer}
.item .like.on{background:#3a1820;border-color:#6b2f3a;color:#ff9a9a}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.open{display:flex}
.modal img{max-width:96vw;max-height:88vh;border-radius:8px}
.modal .close{position:absolute;top:12px;right:16px;color:#fff;font-size:28px;cursor:pointer}
#uploadForm{margin-top:8px;display:none}
.hidden{display:none!important}
.fade{opacity:.5;pointer-events:none}
.err{color:#ff9a9a;font-size:12px}
#setup input{margin:6px 0}
#bigmsg{text-align:center;padding:40px 10px;color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ХРАНИЛИЩЕ</h1>
    <p>ваш приватный сейф на телефоне</p>
  </header>

  <div id="setup" class="card hidden">
    <h2>ПОДКЛЮЧЕНИЕ</h2>
    <p class="sub">введите репозиторий и токен доступа (выдаёт владелец)</p>
    <input id="inRepo" placeholder="owner/repo">
    <input id="inToken" type="password" placeholder="github token">
    <button class="btn" onclick="saveCfg()">СОХРАНИТЬ</button>
    <div id="setupErr" class="err"></div>
  </div>

  <div id="statusbar"></div>
  <div id="content"></div>
  <div id="bigmsg" class="hidden"></div>
</div>

<div id="modal" class="modal"><span class="close" onclick="closeModal()">✕</span><img id="modalImg" alt=""></div>

<script>
var CFG_KEY = "store_cfg_v1";
var cfg = null;
var treeMap = {};   // path -> {sha,size}
var items = [];     // [{name,type,title,desc,likes,views,size,ts,date}]
var imgCache = {};  // name -> dataURL
var treeJson = "";

function loadCfg(){
  try { cfg = JSON.parse(localStorage.getItem(CFG_KEY) || "null"); } catch(e){ cfg = null; }
  if(!cfg || !cfg.repo || !cfg.token){ showSetup(); return false; }
  return true;
}
function saveCfg(){
  var repo = document.getElementById("inRepo").value.trim();
  var token = document.getElementById("inToken").value.trim();
  if(!repo || !token){ document.getElementById("setupErr").textContent = "заполните оба поля"; return; }
  cfg = {repo: repo, token: token};
  localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
  document.getElementById("setup").classList.add("hidden");
  boot();
}
function showSetup(){
  document.getElementById("setup").classList.remove("hidden");
  document.getElementById("content").innerHTML = "";
}
function status(s){ document.getElementById("statusbar").textContent = s || ""; }

function api(path, opts){
  opts = opts || {};
  var headers = opts.headers || {};
  headers["Authorization"] = "Bearer " + cfg.token;
  headers["Accept"] = "application/vnd.github+json";
  return fetch("https://api.github.com/repos/" + cfg.repo + path, {
    method: opts.method || "GET",
    headers: headers,
    body: opts.body || undefined
  }).then(function(r){
    if(r.status === 401 || r.status === 403){
      localStorage.removeItem(CFG_KEY);
      location.reload();
      throw new Error("auth");
    }
    if(r.status === 404) throw new Error("404");
    return r.json().then(function(j){
      if(!r.ok){ throw new Error((j.message || r.status)); }
      return j;
    });
  });
}
function pathEnc(p){ return p.split("/").map(encodeURIComponent).join("/"); }
function esc(s){
  return String(s==null?"":s).replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/\t/g,"\\t");
}
function unesc(s){
  return String(s==null?"":s).replace(/\\n/g,"\n").replace(/\\t/g,"\t").replace(/\\\\/g,"\\");
}
function typeOf(name){
  var n = name.toLowerCase();
  if(/\.(jpg|jpeg|png|gif|webp|bmp|heic|heif)$/.test(n)) return "photo";
  if(/\.(zip|rar|7z|tar|gz|tgz|xz|bz2)$/.test(n)) return "archive";
  return "other";
}
function fmtSize(b){
  if(b < 1024) return b + " Б";
  if(b < 1048576) return (b/1024).toFixed(1) + " КБ";
  return (b/1048576).toFixed(2) + " МБ";
}
function fmtDate(ts){
  var d = new Date(ts);
  var p = function(x){ return (x<10?"0":"")+x; };
  return p(d.getDate())+"."+p(d.getMonth()+1)+"."+String(d.getFullYear()).slice(2)+" "+p(d.getHours())+":"+p(d.getMinutes());
}

function loadTree(){
  return api("/git/trees/main?recursive=1").then(function(t){
    var map = {};
    (t.tree||[]).forEach(function(e){ if(e.type==="blob") map[e.path] = {sha:e.sha, size:e.size}; });
    treeMap = map;
    return map;
  });
}
function readMetaLines(metaPath){
  if(!treeMap[metaPath]) return Promise.resolve(null);
  return api("/contents/" + pathEnc(metaPath)).then(function(j){
    return {lines: atob(j.content).split("\n"), sha: j.sha};
  });
}
function putMetaLines(metaPath, lines, sha){
  var content = b64FromText(lines.join("\n"));
  var body = {message:"meta " + metaPath, content: content};
  if(sha) body.sha = sha;
  return api("/contents/" + pathEnc(metaPath), {method:"PUT", body: JSON.stringify(body)});
}
function buildItems(){
  var out = [];
  Object.keys(treeMap).forEach(function(p){
    var m = p.match(/^files\/(photo|archive|other)\/(.+)$/);
    if(!m) return;
    var type = m[1], name = m[2];
    var mp = "meta/" + type + "/" + name + ".meta";
    out.push({name:name, type:type, metaPath:mp});
  });
  out.sort(function(a,b){ return a.name.localeCompare(b.name); });
  return out;
}

function render(){
  var content = document.getElementById("content");
  var types = [["photo","ФОТО"],["archive","АРХИВЫ"],["other","ДРУГОЕ"]];
  var html = "";
  var n = 0;
  types.forEach(function(tp){
    var list = items.filter(function(it){ return it.type === tp[0]; });
    if(!list.length) return;
    n += list.length;
    html += '<div class="card"><h2>' + tp[1] + ' <span class="n">(' + list.length + ')</span></h2>';
    html += '<button class="btn sm" style="margin:8px 0" onclick="showUpload(\'' + tp[0] + '\')">ЗАГРУЗИТЬ</button>';
    html += '<div id="upf_' + tp[0] + '"></div>';
    list.forEach(function(it){ html += itemHtml(it); });
    html += '</div>';
  });
  content.innerHTML = html || '<div id="bigmsg">пока пусто</div>';
  status(n ? "обновлено " + new Date().toLocaleTimeString() : "");
}

function itemHtml(it){
  var isImg = it.type === "photo";
  var m = it.meta || {};
  var thumb = isImg ? '<img class="thumb" src="' + (imgCache[it.name] || "") + '" onclick="openPhoto(\'' + js(it.name) + '\')">' : '<div class="thumb" style="display:flex;align-items:center;justify-content:center;color:#8a8fa0;font-size:28px">📦</div>';
  return '<div class="item">' + thumb +
    '<div class="info"><div class="t">' + escHtml(it.title) + '</div>' +
    (m.desc ? '<div class="d">' + escHtml(m.desc) + '</div>' : '') +
    '<div class="meta">' + fmtSize(it.size) + ' · ' + fmtDate(it.ts) + ' · ' + (m.views||0) + ' просмотров</div>' +
    '<div class="acts">' +
    '<button class="like' + (m.liked ? " on" : "") + '" onclick="like(\'' + js(it.name) + '\',\'' + it.type + '\')">♥ ' + (m.likes||0) + '</button>' +
    '<button class="btn sm" onclick="openPhoto(\'' + js(it.name) + '\')">ОТКРЫТЬ</button>' +
    '<button class="btn sm" onclick="download(\'' + js(it.name) + '\',\'' + it.type + '\')">СКАЧАТЬ</button>' +
    '</div></div></div>';
}
function js(s){ return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }
function escHtml(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function getItem(name){
  return items.filter(function(it){ return it.name === name; })[0];
}
function loadImg(name){
  var it = getItem(name);
  if(!it || imgCache[name]) return Promise.resolve(imgCache[name]);
  return api("/contents/" + pathEnc("files/photo/" + name)).then(function(j){
    var u = "data:image/jpeg;base64," + j.content;
    imgCache[name] = u;
    return u;
  });
}
function openPhoto(name){
  var it = getItem(name);
  if(!it) return;
  if(it.type === "photo"){
    loadImg(name).then(function(u){
      document.getElementById("modalImg").src = u;
      document.getElementById("modal").classList.add("open");
    });
  } else {
    download(name, it.type);
  }
  bumpView(it);
}
function closeModal(){ document.getElementById("modal").classList.remove("open"); }
function download(name, type){
  api("/contents/" + pathEnc("files/" + type + "/" + name)).then(function(j){
    var bytes = base64ToBytes(j.content);
    var blob = new Blob([bytes]);
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 5000);
  });
}
function base64ToBytes(b64){
  var bin = atob(b64);
  var out = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
function bumpView(it){
  if(!it.meta) it.meta = {title:it.title, desc:"", likes:0, views:0};
  it.meta.views = (it.meta.views||0) + 1;
  var lines = [esc(it.meta.title), esc(it.meta.desc), String(it.meta.likes||0), String(it.meta.views)];
  putMetaLines(it.metaPath, lines, it.metaSha).then(function(j){
    it.metaSha = j.content.sha;
    refreshMeta(it);
  }).catch(function(e){ status("view err: " + e.message); });
}
function like(name, type){
  var it = getItem(name);
  if(!it) return;
  if(!it.meta) it.meta = {title:it.title, desc:"", likes:0, views:0};
  it.meta.likes = (it.meta.likes||0) + 1;
  it.meta.liked = true;
  var lines = [esc(it.meta.title), esc(it.meta.desc), String(it.meta.likes), String(it.meta.views||0)];
  putMetaLines(it.metaPath, lines, it.metaSha).then(function(j){
    it.metaSha = j.content.sha;
    render();
  }).catch(function(e){ status("like err: " + e.message); });
}
function refreshMeta(it){
  readMetaLines(it.metaPath).then(function(r){
    if(!r) return;
    it.meta = parseMeta(r.lines, it.name);
    it.metaSha = r.sha;
  });
}
function parseMeta(lines, name){
  var m = {title: name, desc:"", likes:0, views:0};
  if(lines && lines.length >= 4){
    m.title = unesc(lines[0]) || name;
    m.desc = unesc(lines[1]);
    m.likes = parseInt(lines[2],10) || 0;
    m.views = parseInt(lines[3],10) || 0;
  }
  return m;
}
function showUpload(type){
  var box = document.getElementById("upf_" + type);
  if(box.innerHTML){
    box.innerHTML = "";
    return;
  }
  box.innerHTML =
    '<input id="up_title" placeholder="название (необязательно)">' +
    '<input id="up_desc" placeholder="описание (необязательно)">' +
    '<input type="file" id="up_file">' +
    '<div class="row"><button class="btn" onclick="doUpload(\'' + type + '\')">ОТПРАВИТЬ</button>' +
    '<button class="btn red" onclick="showUpload(\'' + type + '\')">ОТМЕНА</button></div>' +
    '<div class="muted">файл попадёт в хранилище и синхронизируется с телефоном</div>';
}
function doUpload(type){
  var f = document.getElementById("up_file").files[0];
  if(!f){ status("выберите файл"); return; }
  var title = document.getElementById("up_title").value.trim();
  var desc = document.getElementById("up_desc").value.trim();
  status("загрузка " + f.name + "...");
  readFileB64(f, function(b64){
    var path = "files/" + type + "/" + f.name;
    var body = {message:"upload " + f.name, content: b64};
    if(treeMap[path]) body.sha = treeMap[path].sha;
    api("/contents/" + pathEnc(path), {method:"PUT", body: JSON.stringify(body)}).then(function(){
      var metaPath = "meta/" + type + "/" + f.name + ".meta";
      var msha = treeMap[metaPath] ? treeMap[metaPath].sha : null;
      var lines = [esc(title || f.name), esc(desc), "0", "0"];
      return putMetaLines(metaPath, lines, msha);
    }).then(function(){
      status("загружено");
      document.getElementById("upf_" + type).innerHTML = "";
      boot();
    }).catch(function(e){ status("upload err: " + e.message); });
  });
}
function readFileB64(file, cb){
  var reader = new FileReader();
  reader.onload = function(){
    var bin = new Uint8Array(reader.result);
    var chunks = [];
    var CH = 0x8000;
    for(var i=0;i<bin.length;i+=CH){
      chunks.push(String.fromCharCode.apply(null, bin.subarray(i, i+CH)));
    }
    cb(btoa(chunks.join("")));
  };
  reader.readAsArrayBuffer(file);
}
function b64FromText(t){
  var bin = "";
  for(var i=0;i<t.length;i++) bin += String.fromCharCode(t.charCodeAt(i) & 0xff);
  return btoa(bin);
}

function refresh(){
  loadTree().then(function(){
    var newItems = buildItems();
    var newJson = JSON.stringify(newItems);
    if(newJson !== treeJson){
      treeJson = newJson;
      items = newItems;
      var todo = 0;
      items.forEach(function(it){
        readMetaLines(it.metaPath).then(function(r){
          it.meta = parseMeta(r ? r.lines : null, it.name);
          it.metaSha = r ? r.sha : null;
          todo++;
          if(todo === items.length){
            var first = items.filter(function(x){ return x.type === "photo"; }).slice(0,4);
            var loaded = 0;
            first.forEach(function(p){
              loadImg(p.name).then(function(){ loaded++; if(loaded === first.length) render(); });
            });
            if(!first.length) render();
          }
        }).catch(function(){ todo++; });
      });
      if(!items.length) render();
    } else {
      render();
    }
  }).catch(function(e){ status("err: " + e.message); });
}

function boot(){
  status("загрузка...");
  refresh();
  setInterval(refresh, 30000);
}
document.addEventListener("click", function(e){
  if(e.target.id === "modal") closeModal();
});
if(loadCfg()) boot();
</script>
</body>
</html>
