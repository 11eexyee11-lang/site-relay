name: phone-relay

on:
  schedule:
    - cron: "30 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Join ZeroTier
        run: |
          curl -s https://install.zerotier.com | sudo bash
          sudo zerotier-cli join 48d6023c46a7d1ce
          NODEID=$(sudo zerotier-cli info | awk '{print $3}')
          echo "nodeid: $NODEID"
          if [ -n "${{ secrets.ZT_API_TOKEN }}" ]; then
            curl -sS -X POST "https://my.zerotier.com/api/network/48d6023c46a7d1ce/member/$NODEID" \
              -H "Authorization: Bearer ${{ secrets.ZT_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"config":{"authorized":true}}' || true
          fi
          for i in $(seq 1 60); do
            IP=$(ip -4 addr show | grep -oE '172\.27\.[0-9]+\.[0-9]+' | head -1)
            [ -n "$IP" ] && break
            sleep 3
          done
          echo "zt ip: $IP"
          test -n "$IP"

      - name: Start cloudflared
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --url http://172.27.112.32:8080 --no-autoupdate > /tmp/cf.log 2>&1 &
          echo $! > /tmp/cf.pid
          for i in $(seq 1 90); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done
          echo "TUNNEL_URL=$URL" >> "$GITHUB_ENV"
          test -n "$URL"

      - name: Update redirect page
        run: |
          URL="$TUNNEL_URL"
          cat > index.html <<EOF
          <!doctype html>
          <html lang="ru">
          <head>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=$URL">
          <title>РћС‚РєСЂС‹С‚СЊ СЃР°Р№С‚</title>
          </head>
          <body>
          <p>Р•СЃР»Рё СЃС‚СЂР°РЅРёС†Р° РЅРµ РѕС‚РєСЂС‹Р»Р°СЃСЊ Р°РІС‚РѕРјР°С‚РёС‡РµСЃРєРё - <a href="$URL">РЅР°Р¶РјРёС‚Рµ СЃСЋРґР°</a>.</p>
          </body>
          </html>
          EOF
          git config user.email "relay@example.com"
          git config user.name "relay"
          git add index.html
          git commit -m "relay: $URL"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      - name: Keep alive
        run: sleep 340m